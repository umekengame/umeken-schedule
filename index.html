<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うめけん 配信スケジュール</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "fcfe81ef-af0b-4611-8cb7-7546e8f3e286",
      serviceWorkerPath: "/umeken-schedule/OneSignalSDKWorker.js",
      serviceWorkerParam: {
        scope: "/umeken-schedule/"
      }
    });
  });
</script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      color: #17364a;
      background:
        radial-gradient(circle at top right, rgba(115, 214, 255, .30), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #eefaff 100%);
    }

    .wrap {
      width: min(1180px, 94%);
      margin: auto;
      padding: 24px 0 60px;
    }

    .hero {
      position: relative;
      min-height: 390px;
      overflow: hidden;
      border-radius: 30px;
      padding: 55px;
      background:
        linear-gradient(135deg, #ffffff 0%, #e8f9ff 60%, #c9f0ff 100%);
      border: 1px solid #cfeef8;
      box-shadow: 0 25px 60px rgba(73, 169, 205, 0.15);
      display: flex;
      align-items: center;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      max-width: 560px;
    }

    .tag {
      color: #49afe0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: .95;
      margin: 0;
      color: #16384e;
    }

    h1 span {
      color: #55bee9;
    }

    .hero p {
      color: #668491;
      line-height: 1.8;
      margin-top: 20px;
    }

    .hero-img {
      position: absolute;
      right: -20px;
      bottom: -25px;
      width: min(470px, 44vw);
      z-index: 1;
      filter: drop-shadow(0 16px 30px rgba(45, 120, 150, .18));
    }

    .section-title {
      margin: 38px 0 14px;
    }

    .section-title small {
      color: #59b9dc;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .section-title h2 {
      margin: 5px 0 0;
      font-size: 28px;
    }

    .today-card {
      background: #fff;
      border: 2px solid #aee7f8;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(62, 163, 202, .12);
    }

    .today-head {
      padding: 18px 22px;
      background: linear-gradient(90deg, #dff7ff, #f5fdff);
      font-weight: 900;
      color: #277da0;
    }

    .today-calendar {
      width: 100%;
      height: 260px;
      border: 0;
      display: block;
    }

    .calendar-card {
      background: #fff;
      border: 1px solid #ccebf5;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 22px 55px rgba(65, 160, 195, .12);
    }

    .calendar-bar {
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #effbff, #dff6ff);
      border-bottom: 1px solid #d3eef6;
    }

    .calendar-bar strong {
      font-size: 15px;
    }

    .auto {
      font-size: 12px;
      color: #57a9c5;
    }

    .month-calendar {
      width: 100%;
      height: 760px;
      border: 0;
      display: block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }

    .info {
      background: rgba(255,255,255,.9);
      border: 1px solid #d8eff6;
      border-radius: 20px;
      padding: 20px;
    }

    .info strong {
      display: block;
      margin-bottom: 6px;
    }

    .info p {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: #748f9b;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #8ca5b0;
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .wrap {
        width: 100%;
        padding: 10px 10px 35px;
      }

      .hero {
        min-height: 430px;
        padding: 30px 24px;
        align-items: flex-start;
      }

      .hero-text {
        max-width: 100%;
      }

      h1 {
        font-size: 43px;
      }

      .hero-img {
        width: 300px;
        right: -60px;
        bottom: -10px;
        opacity: .95;
      }

      .today-calendar {
        height: 300px;
      }

      .month-calendar {
        height: 680px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section class="hero">

      <div class="hero-text">
        <div class="tag">UMEKEN OFFICIAL</div>

        <h1>
          STREAM<br>
          <span>SCHEDULE</span>
        </h1>

        <p>
          うめけんのゲーム配信・企画・歌枠などの
          最新スケジュールを掲載しています。
        </p>
      </div>

      <img
        src="b02＿背景透過.png"
        alt="うめけん"
        class="hero-img">
    </section>


    <div class="section-title">
      <small>NEXT STREAM</small>
      <h2>今日〜直近の配信予定</h2>
    </div>

    <section class="today-card">

      <div class="today-head">
        🎮 最新の配信予定
      </div>

      <iframe
        class="today-calendar"
        src="https://calendar.google.com/calendar/embed?src=589eb655b73cf456af1f6785374a69ebc99ae26cc5df0d868e1c48576ccf6a8b%40group.calendar.google.com&ctz=Asia%2FTokyo&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0">
      </iframe>

    </section>


    <div class="section-title">
      <small>MONTHLY CALENDAR</small>
      <h2>今月の配信予定</h2>
    </div>

    <section class="calendar-card">

      <div class="calendar-bar">
        <strong>📅 UMEKEN CALENDAR</strong>
        <span class="auto">自動更新</span>
      </div>

      <iframe
        class="month-calendar"
        src="https://calendar.google.com/calendar/embed?src=589eb655b73cf456af1f6785374a69ebc99ae26cc5df0d868e1c48576ccf6a8b%40group.calendar.google.com&ctz=Asia%2FTokyo&mode=MONTH&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0">
      </iframe>

    </section>


    <section class="info-grid">

      <div class="info">
        <strong>📅 随時更新</strong>
        <p>
          配信予定が決まり次第、
          Googleカレンダーから自動反映されます。
        </p>
      </div>

      <div class="info">
        <strong>⏰ 時間変更あり</strong>
        <p>
          配信時間や内容は変更になる場合があります。
        </p>
      </div>

      <div class="info">
        <strong>🎮 配信内容</strong>
        <p>
          人狼・Among Us・歌枠・企画などを掲載します。
        </p>
      </div>

    </section>

    <footer>
      © UMEKEN STREAM SCHEDULE
    </footer>

  </div>
</body>
</html>
